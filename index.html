<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counting the Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1d2433;
    --night-soft: #252d3f;
    --card: #2a3347;
    --line: #3a4459;
    --ink: #ece8de;
    --ink-dim: #9aa3b5;
    --gold: #d9a45b;
    --gold-soft: rgba(217, 164, 91, 0.16);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--night) 0%, var(--night-soft) 68%, #2b3040 100%);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    font-weight: 400;
    display: flex;
    justify-content: center;
    padding: 3.5rem 1.25rem 4rem;
  }

  .page {
    width: 100%;
    max-width: 760px;
    animation: settle 0.9s ease-out both;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .page { animation: none; }
  }

  header { text-align: center; margin-bottom: 3rem; }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 0.9rem;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(1.7rem, 4.5vw, 2.4rem);
    letter-spacing: 0.01em;
  }

  .today-line {
    margin-top: 0.7rem;
    font-size: 0.95rem;
    color: var(--ink-dim);
  }
  .today-line strong { color: var(--ink); font-weight: 500; }

  .counters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.1rem;
    margin-bottom: 2.75rem;
  }

  @media (max-width: 560px) {
    .counters { grid-template-columns: 1fr; }
  }

  .counter {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2rem 1.5rem 1.75rem;
    text-align: center;
  }

  .counter-label {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 1.1rem;
    line-height: 1.6;
  }

  .counter-number {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(3.6rem, 11vw, 5rem);
    line-height: 1;
  }

  .counter.since .counter-number { color: var(--ink); }
  .counter.until .counter-number { color: var(--gold); }

  .counter-unit {
    font-size: 0.9rem;
    color: var(--ink-dim);
    margin-top: 0.5rem;
  }

  .counter-sub {
    font-size: 0.85rem;
    color: var(--ink-dim);
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  .counter-sub .date { color: var(--ink); font-weight: 500; }

  .thread-section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.9rem 1.6rem 1.7rem;
  }

  .thread-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.3rem;
    gap: 1rem;
  }

  .thread-title {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 1.05rem;
  }

  .thread-pct {
    font-size: 0.85rem;
    color: var(--gold);
    white-space: nowrap;
  }

  .dots {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }

  .dot.past {
    background: var(--ink-dim);
    border-color: var(--ink-dim);
    opacity: 0.75;
  }

  .dot.today {
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-soft);
    transform: scale(1.25);
  }

  .thread-ends {
    display: flex;
    justify-content: space-between;
    margin-top: 1.2rem;
    font-size: 0.78rem;
    color: var(--ink-dim);
  }
  .thread-ends span:last-child { text-align: right; }
  .thread-ends .end-date { display: block; color: var(--ink); font-weight: 500; font-size: 0.85rem; margin-bottom: 0.15rem; }

  footer {
    text-align: center;
    margin-top: 2.5rem;
    font-size: 0.85rem;
    color: var(--ink-dim);
    line-height: 1.7;
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div class="eyebrow">One day at a time</div>
      <h1>Counting the Days</h1>
      <div class="today-line">Today is <strong id="todayDate"></strong></div>
    </header>

    <div class="counters">
      <div class="counter since">
        <div class="counter-label">Days since I last saw Shira</div>
        <div class="counter-number" id="daysSince">&ndash;</div>
        <div class="counter-unit" id="sinceWeeks"></div>
        <div class="counter-sub">Last seen <span class="date">May 21, 2026</span></div>
      </div>

      <div class="counter until">
        <div class="counter-label">Days until the bench trial</div>
        <div class="counter-number" id="daysUntil">&ndash;</div>
        <div class="counter-unit" id="untilWeeks"></div>
        <div class="counter-sub">Custody bench trial <span class="date">November 4, 2026</span></div>
      </div>
    </div>

    <div class="thread-section">
      <div class="thread-head">
        <div class="thread-title">The stretch between</div>
        <div class="thread-pct" id="pctLine"></div>
      </div>
      <div class="dots" id="dots" aria-label="One mark for each day between May 21 and November 4, 2026"></div>
      <div class="thread-ends">
        <span><span class="end-date">May 21</span>last saw Shira</span>
        <span><span class="end-date">Nov 4</span>bench trial</span>
      </div>
    </div>

    <footer id="footerNote"></footer>
  </div>

<script>
(function () {
  var START = new Date(2026, 4, 21);
  var END   = new Date(2026, 10, 4);

  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  var MS_DAY = 24 * 60 * 60 * 1000;
  function daysBetween(a, b) { return Math.round((b - a) / MS_DAY); }

  var daysSince = daysBetween(START, today);
  var daysUntil = daysBetween(today, END);
  var totalSpan = daysBetween(START, END);

  document.getElementById('todayDate').textContent = today.toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });

  document.getElementById('daysSince').textContent = Math.max(daysSince, 0);
  document.getElementById('daysUntil').textContent = Math.max(daysUntil, 0);

  function weeksText(d) {
    if (d < 7) return d === 1 ? '1 day' : d + ' days';
    var w = Math.floor(d / 7), r = d % 7;
    var t = w + (w === 1 ? ' week' : ' weeks');
    if (r > 0) t += ', ' + r + (r === 1 ? ' day' : ' days');
    return t;
  }
  document.getElementById('sinceWeeks').textContent = weeksText(Math.max(daysSince, 0));
  document.getElementById('untilWeeks').textContent = weeksText(Math.max(daysUntil, 0));

  var pct = Math.min(100, Math.max(0, Math.round((daysSince / totalSpan) * 100)));
  var pctEl = document.getElementById('pctLine');
  if (daysUntil > 0) {
    pctEl.textContent = pct + '% of the way there';
  } else if (daysUntil === 0) {
    pctEl.textContent = 'Today is the day';
  } else {
    pctEl.textContent = 'The trial date has passed';
  }

  var dotsEl = document.getElementById('dots');
  var frag = document.createDocumentFragment();
  for (var i = 0; i <= totalSpan; i++) {
    var dot = document.createElement('div');
    dot.className = 'dot';
    if (i < daysSince) dot.className += ' past';
    if (i === daysSince && daysUntil >= 0) dot.className += ' today';
    frag.appendChild(dot);
  }
  dotsEl.appendChild(frag);

  var footer = document.getElementById('footerNote');
  if (daysUntil > 0) {
    footer.textContent = 'Every filled mark is a day already behind you.';
  } else if (daysUntil === 0) {
    footer.textContent = 'November 4th is here. Steady.';
  } else {
    footer.textContent = 'The stretch is behind you now.';
  }

  var nextMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
  setTimeout(function () { location.reload(); }, nextMidnight - now + 1000);
})();
</script>
</body>
</html>
